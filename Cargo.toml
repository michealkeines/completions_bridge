[workspace]
resolver = "2"
members = [
    "crates/bridge-types",
    "crates/bridge-policy",
    "crates/bridge-engine",
    "crates/bridge-claude",
    "crates/bridge-openai",
    "crates/completions-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bridge-types = { path = "crates/bridge-types" }
bridge-policy = { path = "crates/bridge-policy" }
bridge-engine = { path = "crates/bridge-engine" }
bridge-claude = { path = "crates/bridge-claude" }
bridge-openai = { path = "crates/bridge-openai" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
jsonschema = { version = "0.30", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
